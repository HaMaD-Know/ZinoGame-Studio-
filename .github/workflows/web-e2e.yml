# End-to-end browser tests (Playwright) against the production web build.
# Runs Chromium (desktop + iPad-sized touch layouts) and WebKit (iPad Pro
# emulation — the closest automated approximation of iPad Safari/WKWebView).

name: Web E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'ios/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'ios/**']

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build web app
        run: npm run build:web

      - name: Run end-to-end tests
        env:
          CI: 'true'
          PW_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            npx playwright test --project=ipad-webkit
          else
            npx playwright test --project=desktop-chromium --project=ipad-landscape-chromium --project=ipad-portrait-chromium
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
